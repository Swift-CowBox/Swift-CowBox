name: 'Test'
description: 'Test'
inputs:
  swift-syntax-version:
    description: 'swift-syntax-version'
    required: true
  configuration:
    description: 'configuration'
    required: true

runs:
  using: composite
  steps:
    - name: Set GitHub Path
      run: echo "$GITHUB_ACTION_PATH" >> $GITHUB_PATH
      shell: bash
      env:
        GITHUB_ACTION_PATH: ${{ github.action_path }}
    - name: Test
      run: action.sh
      shell: bash
      env:
        INPUT_SWIFT_SYNTAX_VERSION: ${{ inputs.swift-syntax-version }}
        INPUT_CONFIGURATION: ${{ inputs.configuration }}
